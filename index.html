<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Video Player</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
    }

    .player {
      width: 100%;
      max-width: 1000px;
      background: #111;
      overflow: hidden;
    }

    video {
      display: block;
      width: 100%;
      height: auto;
      max-height: 90vh;
      background: #000;
    }
  </style>
</head>

<body>

  <div class="player">
    <video
      controls
      controlsList="nodownload"
      preload="metadata"
      playsinline
      poster="poster.jpg">

      <source src="video.mp4" type="video/mp4">

      Your browser does not support HTML5 video.
    </video>
  </div>

</body>
        </html>
