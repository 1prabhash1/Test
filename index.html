<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>My Video Player</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #050505;
    color: white;
    font-family: Arial, sans-serif;
}

.app {
    width: 100%;
    max-width: 1100px;
    margin: auto;
    padding: 15px;
}

h1 {
    font-size: 24px;
    margin: 0 0 15px;
}

.url-box {
    display: flex;
    gap: 8px;
    margin-bottom: 15px;
}

#urlInput {
    flex: 1;
    min-width: 0;

    height: 45px;

    padding: 0 14px;

    border: 1px solid #333;
    border-radius: 8px;

    background: #151515;
    color: white;

    outline: none;
}

#loadButton {
    height: 45px;

    padding: 0 20px;

    border: none;
    border-radius: 8px;

    background: white;
    color: black;

    font-weight: bold;

    cursor: pointer;
}

.player {
    width: 100%;

    aspect-ratio: 16 / 9;

    background: black;

    border-radius: 10px;

    overflow: hidden;

    position: relative;
}

#youtubePlayer,
#videoPlayer {
    width: 100%;
    height: 100%;
}

iframe,
video {
    width: 100%;
    height: 100%;

    border: none;

    display: block;

    background: black;
}

.hidden {
    display: none !important;
}

.error {
    margin-top: 10px;

    padding: 12px;

    background: #1a0808;

    border: 1px solid #552222;

    color: #ff7777;

    border-radius: 7px;

    font-size: 14px;
}

.info {
    margin-top: 12px;

    padding: 14px;

    background: #111;

    border-radius: 8px;

    color: #aaa;

    font-size: 13px;
}

@media (max-width: 600px) {

    .app {
        padding: 8px;
    }

    h1 {
        font-size: 20px;
    }

    .url-box {
        flex-direction: column;
    }

    #loadButton {
        width: 100%;
    }

}

</style>

</head>


<body>

<div class="app">

    <h1>My Video Player</h1>


    <div class="url-box">

        <input
            id="urlInput"
            type="url"
            placeholder="Paste YouTube or direct MP4 URL..."
            autocomplete="off"
        >

        <button id="loadButton">
            Load Video
        </button>

    </div>


    <div class="player">

        <!-- YouTube -->

        <div
            id="youtubePlayer"
            class="hidden"
        ></div>


        <!-- Direct Video -->

        <video
            id="videoPlayer"
            class="hidden"
            controls
            playsinline
            preload="metadata"
        ></video>

    </div>


    <div
        id="error"
        class="error hidden"
    ></div>


    <div class="info">

        <b>Supported URLs</b>

        <br><br>

        YouTube:

        <br>

        https://www.youtube.com/watch?v=VIDEO_ID

        <br>

        https://youtu.be/VIDEO_ID

        <br><br>

        Direct video:

        <br>

        https://example.com/video.mp4

    </div>

</div>


<!-- YouTube IFrame API -->

<script src="https://www.youtube.com/iframe_api"></script>


<script>

/* =========================================
   ELEMENTS
========================================= */

const urlInput =
    document.getElementById("urlInput");

const loadButton =
    document.getElementById("loadButton");

const youtubePlayer =
    document.getElementById("youtubePlayer");

const videoPlayer =
    document.getElementById("videoPlayer");

const errorBox =
    document.getElementById("error");


/* =========================================
   YOUTUBE PLAYER
========================================= */

let ytPlayer = null;


/* YouTube API calls this automatically */

function onYouTubeIframeAPIReady() {

    console.log(
        "YouTube API loaded"
    );

}


/* =========================================
   ERROR
========================================= */

function showError(message) {

    errorBox.textContent =
        message;

    errorBox.classList.remove(
        "hidden"
    );

}


function hideError() {

    errorBox.classList.add(
        "hidden"
    );

}


/* =========================================
   EXTRACT YOUTUBE ID
========================================= */

function getYouTubeID(url) {

    try {

        const parsed =
            new URL(url);


        /* youtube.com/watch?v= */

        if (
            parsed.hostname
                .includes("youtube.com")
        ) {

            const id =
                parsed.searchParams.get(
                    "v"
                );

            if (id) {
                return id;
            }


            /* youtube.com/embed/ID */

            const embedMatch =
                parsed.pathname.match(
                    /\/embed\/([^/?]+)/
                );

            if (embedMatch) {

                return embedMatch[1];

            }


            /* youtube.com/shorts/ID */

            const shortsMatch =
                parsed.pathname.match(
                    /\/shorts\/([^/?]+)/
                );

            if (shortsMatch) {

                return shortsMatch[1];

            }

        }


        /* youtu.be/ID */

        if (
            parsed.hostname ===
            "youtu.be"
        ) {

            const id =
                parsed.pathname
                    .split("/")
                    .filter(Boolean)[0];

            if (id) {
                return id;
            }

        }

    }

    catch {

        return null;

    }


    return null;

}


/* =========================================
   CHECK DIRECT VIDEO
========================================= */

function isDirectVideo(url) {

    return /\.(mp4|webm|ogg|m4v)(\?.*)?$/i
        .test(url);

}


/* =========================================
   LOAD YOUTUBE
========================================= */

function loadYouTube(videoId) {

    videoPlayer.pause();

    videoPlayer.removeAttribute(
        "src"
    );

    videoPlayer.classList.add(
        "hidden"
    );


    youtubePlayer.classList.remove(
        "hidden"
    );


    if (ytPlayer) {

        ytPlayer.loadVideoById(
            videoId
        );

        return;

    }


    /* Create YouTube player */

    ytPlayer =
        new YT.Player(
            "youtubePlayer",
            {

                videoId: videoId,

                width: "100%",

                height: "100%",

                playerVars: {

                    playsinline: 1,

                    rel: 0,

                    modestbranding: 1

                },

                events: {

                    onReady:
                        function() {

                            console.log(
                                "YouTube player ready"
                            );

                        },

                    onError:
                        function(event) {

                            showError(
                                "YouTube could not play this video. The video may be private, removed, age-restricted, or embedding may be disabled."
                            );

                            console.log(
                                "YouTube error:",
                                event.data
                            );

                        }

                }

            }
        );

}


/* =========================================
   LOAD DIRECT VIDEO
========================================= */

function loadDirectVideo(url) {

    if (ytPlayer) {

        ytPlayer.stopVideo();

    }


    youtubePlayer.classList.add(
        "hidden"
    );


    videoPlayer.classList.remove(
        "hidden"
    );


    videoPlayer.pause();


    videoPlayer.src =
        url;


    videoPlayer.load();


    videoPlayer.play()
        .catch(
            function() {
                /* Browser autoplay may be blocked */
            }
        );

}


/* =========================================
   LOAD URL
========================================= */

function loadURL() {

    const url =
        urlInput.value.trim();


    if (!url) {

        showError(
            "Please enter a video URL."
        );

        return;

    }


    hideError();


    const youtubeID =
        getYouTubeID(url);


    /* YouTube */

    if (youtubeID) {

        loadYouTube(
            youtubeID
        );

        return;

    }


    /* Direct video */

    if (
        isDirectVideo(url)
    ) {

        loadDirectVideo(
            url
        );

        return;

    }


    showError(
        "Unsupported URL. Paste a YouTube URL or a direct MP4/WebM video URL."
    );

}


/* =========================================
   BUTTON
========================================= */

loadButton.addEventListener(
    "click",
    loadURL
);


/* =========================================
   ENTER
========================================= */

urlInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            loadURL();

        }

    }
);


/* =========================================
   URL PARAMETER
========================================= */

/*

You can also open:

index.html?video=https://www.youtube.com/watch?v=VIDEO_ID

OR:

index.html?video=https://example.com/video.mp4

*/

const params =
    new URLSearchParams(
        window.location.search
    );


const parameterVideo =
    params.get(
        "video"
    );


if (parameterVideo) {

    urlInput.value =
        parameterVideo;

    /*
       Wait for YouTube API if
       the supplied URL is YouTube.
    */

    const youtubeID =
        getYouTubeID(
            parameterVideo
        );


    if (youtubeID) {

        function waitForYouTube() {

            if (
                typeof YT !==
                "undefined" &&
                YT.Player
            ) {

                loadYouTube(
                    youtubeID
                );

            }

            else {

                setTimeout(
                    waitForYouTube,
                    300
                );

            }

        }

        waitForYouTube();

    }

    else {

        loadURL();

    }

}

</script>

</body>

</html>
