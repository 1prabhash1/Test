<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>My Video Player</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    min-height: 100%;

    background: #050505;
    color: white;

    font-family: Arial, sans-serif;
}

body {
    padding: 12px;
}

.app {
    width: 100%;
    max-width: 1100px;
    margin: auto;
}

/* HEADER */

.title {
    font-size: 24px;
    font-weight: bold;
    margin-bottom: 14px;
}

.url-box {
    display: flex;
    gap: 8px;
    margin-bottom: 15px;
}

#urlInput {
    flex: 1;
    min-width: 0;

    height: 45px;

    padding: 0 14px;

    background: #151515;
    color: white;

    border: 1px solid #333;
    border-radius: 8px;

    outline: none;

    font-size: 14px;
}

#urlInput:focus {
    border-color: #777;
}

#loadButton {
    height: 45px;

    padding: 0 22px;

    border: 0;
    border-radius: 8px;

    background: white;
    color: black;

    font-weight: bold;

    cursor: pointer;
}

#loadButton:hover {
    background: #ddd;
}

/* PLAYER */

.player {
    position: relative;

    width: 100%;

    aspect-ratio: 16 / 9;

    background: black;

    border-radius: 10px;

    overflow: hidden;
}

.player iframe,
.player video {
    width: 100%;
    height: 100%;

    display: block;

    border: 0;

    background: black;
}

.hidden {
    display: none !important;
}

/* ERROR */

#error {
    margin-top: 10px;

    padding: 12px;

    background: #180707;

    border: 1px solid #512222;

    color: #ff7777;

    border-radius: 7px;

    font-size: 14px;

    line-height: 1.5;
}

/* INFO */

.info {
    margin-top: 12px;

    padding: 14px;

    background: #111;

    border-radius: 8px;

    color: #999;

    font-size: 13px;

    line-height: 1.6;
}

/* MOBILE */

@media (max-width: 600px) {

    body {
        padding: 7px;
    }

    .title {
        font-size: 20px;
    }

    .url-box {
        flex-direction: column;
    }

    #loadButton {
        width: 100%;
    }
}
</style>

</head>

<body>

<div class="app">

    <div class="title">
        My Video Player
    </div>


    <div class="url-box">

        <input
            id="urlInput"
            type="text"
            placeholder="Paste YouTube or direct video URL"
            autocomplete="off"
        >

        <button id="loadButton">
            Load
        </button>

    </div>


    <div class="player">

        <!-- YouTube player -->
        <div
            id="youtubeContainer"
            class="hidden"
        ></div>


        <!-- Normal video -->
        <video
            id="video"
            class="hidden"
            controls
            playsinline
            preload="metadata"
        ></video>

    </div>


    <div
        id="error"
        class="hidden"
    ></div>


    <div class="info">

        <b>Supported URLs</b>

        <br><br>

        YouTube:

        <br>

        https://www.youtube.com/watch?v=VIDEO_ID

        <br>

        https://youtu.be/VIDEO_ID

        <br>

        https://www.youtube.com/shorts/VIDEO_ID

        <br><br>

        Direct video:

        <br>

        https://example.com/video.mp4

    </div>

</div>


<!-- YouTube IFrame API -->

<script src="https://www.youtube.com/iframe_api"></script>


<script>

/* =========================================
   ELEMENTS
========================================= */

const input =
    document.getElementById("urlInput");

const loadButton =
    document.getElementById("loadButton");

const youtubeContainer =
    document.getElementById(
        "youtubeContainer"
    );

const video =
    document.getElementById("video");

const errorBox =
    document.getElementById("error");


/* =========================================
   YOUTUBE PLAYER
========================================= */

let youtubePlayer = null;


/*
   YouTube calls this function
   after the API has loaded.
*/

function onYouTubeIframeAPIReady() {

    console.log(
        "YouTube API ready"
    );

}


/* =========================================
   ERROR
========================================= */

function showError(message) {

    errorBox.textContent =
        message;

    errorBox.classList.remove(
        "hidden"
    );
}


function hideError() {

    errorBox.classList.add(
        "hidden"
    );
}


/* =========================================
   GET YOUTUBE VIDEO ID
========================================= */

function getYouTubeId(value) {

    let url;

    try {

        /*
           Add https:// when someone
           pastes youtu.be/... without it.
        */

        if (
            !value.startsWith("http://") &&
            !value.startsWith("https://")
        ) {

            value =
                "https://" + value;

        }

        url =
            new URL(value);

    } catch {

        return null;

    }


    const host =
        url.hostname
            .toLowerCase()
            .replace(
                /^www\./,
                ""
            );


    /*
       youtu.be/VIDEO_ID
    */

    if (
        host === "youtu.be"
    ) {

        const parts =
            url.pathname
                .split("/")
                .filter(Boolean);

        return parts[0] || null;
    }


    /*
       youtube.com
    */

    if (
        host === "youtube.com" ||
        host === "m.youtube.com"
    ) {

        /*
           /watch?v=VIDEO_ID
        */

        if (
            url.pathname === "/watch"
        ) {

            return url.searchParams.get(
                "v"
            );

        }


        /*
           /shorts/VIDEO_ID
        */

        const shorts =
            url.pathname.match(
                /^\/shorts\/([^/?]+)/
            );

        if (shorts) {

            return shorts[1];

        }


        /*
           /embed/VIDEO_ID
        */

        const embed =
            url.pathname.match(
                /^\/embed\/([^/?]+)/
            );

        if (embed) {

            return embed[1];

        }


        /*
           /live/VIDEO_ID
        */

        const live =
            url.pathname.match(
                /^\/live\/([^/?]+)/
            );

        if (live) {

            return live[1];

        }

    }


    return null;
}


/* =========================================
   CHECK DIRECT VIDEO
========================================= */

function isDirectVideo(value) {

    return /\.(mp4|webm|ogg|m4v)(\?.*)?$/i
        .test(value);

}


/* =========================================
   WAIT FOR YOUTUBE API
========================================= */

function waitForYouTube(
    videoId
) {

    if (
        typeof YT !== "undefined" &&
        YT.Player
    ) {

        createYouTubePlayer(
            videoId
        );

        return;
    }


    setTimeout(
        function() {

            waitForYouTube(
                videoId
            );

        },
        200
    );
}


/* =========================================
   CREATE YOUTUBE PLAYER
========================================= */

function createYouTubePlayer(
    videoId
) {

    video.pause();

    video.removeAttribute(
        "src"
    );

    video.load();

    video.classList.add(
        "hidden"
    );


    youtubeContainer.classList.remove(
        "hidden"
    );


    /*
       First player
    */

    if (!youtubePlayer) {

        youtubePlayer =
            new YT.Player(
                "youtubeContainer",
                {

                    width: "100%",

                    height: "100%",

                    videoId: videoId,

                    playerVars: {

                        autoplay: 0,

                        controls: 1,

                        rel: 0,

                        playsinline: 1,

                        modestbranding: 1

                    },

                    events: {

                        onReady:
                            function() {

                                console.log(
                                    "YouTube player ready"
                                );

                            },


                        onError:
                            function(event) {

                                let message =
                                    "YouTube could not play this video.";

                                /*
                                   Common YouTube
                                   player errors.
                                */

                                if (
                                    event.data === 101 ||
                                    event.data === 150
                                ) {

                                    message =
                                        "This YouTube video does not allow playback on other websites.";

                                }

                                else if (
                                    event.data === 100
                                ) {

                                    message =
                                        "This YouTube video was not found or is unavailable.";

                                }

                                else if (
                                    event.data === 2
                                ) {

                                    message =
                                        "The YouTube video ID is invalid.";

                                }


                                showError(
                                    message
                                );

                                console.log(
                                    "YouTube error:",
                                    event.data
                                );

                            }

                    }

                }
            );

    }

    else {

        /*
           Existing player
        */

        youtubePlayer.loadVideoById(
            videoId
        );

    }

}


/* =========================================
   DIRECT VIDEO
========================================= */

function loadDirectVideo(
    url
) {

    /*
       Hide YouTube
    */

    youtubeContainer.classList.add(
        "hidden"
    );


    /*
       Stop YouTube
    */

    if (youtubePlayer) {

        try {

            youtubePlayer.stopVideo();

        } catch {}

    }


    /*
       Show normal video
    */

    video.classList.remove(
        "hidden"
    );


    video.pause();

    video.src =
        url;

    video.load();


    video.play()
        .catch(
            function() {
                /*
                   Autoplay may be blocked.
                   User can press Play.
                */
            }
        );


    video.onerror =
        function() {

            showError(
                "The direct video could not be played. Check the URL, video format, CORS, and server configuration."
            );

        };

}


/* =========================================
   LOAD URL
========================================= */

function loadURL() {

    hideError();


    let url =
        input.value.trim();


    if (!url) {

        showError(
            "Please paste a video URL."
        );

        return;
    }


    /*
       YOUTUBE
    */

    const youtubeId =
        getYouTubeId(url);


    if (youtubeId) {

        waitForYouTube(
            youtubeId
        );

        return;

    }


    /*
       DIRECT VIDEO
    */

    if (
        isDirectVideo(url)
    ) {

        loadDirectVideo(
            url
        );

        return;

    }


    /*
       UNKNOWN
    */

    showError(
        "Unsupported URL. Please enter a YouTube URL or a direct MP4/WebM URL."
    );

}


/* =========================================
   LOAD BUTTON
========================================= */

loadButton.addEventListener(
    "click",
    loadURL
);


/* =========================================
   ENTER KEY
========================================= */

input.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            loadURL();

        }

    }
);


/* =========================================
   URL PARAMETER
========================================= */

/*
   Example:

   index.html?video=https://youtu.be/1dLm1uWpD5c

*/

const params =
    new URLSearchParams(
        window.location.search
    );


const parameter =
    params.get(
        "video"
    );


if (parameter) {

    input.value =
        parameter;

    /*
       If YouTube, wait for
       YouTube API.
    */

    const id =
        getYouTubeId(
            parameter
        );


    if (id) {

        waitForYouTube(
            id
        );

    }

    else {

        loadURL();

    }

}

</script>

</body>

</html>
